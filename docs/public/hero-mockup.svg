<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="100%">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10E5C2" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#131B2A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .t-mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }
    .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .dim { fill: #64748B; }
    .norm { fill: #CBD5E1; }
    .bright { fill: #F8FAFC; }
    .cyan { fill: #06B6D4; }
    .green { fill: #10E5C2; }
    .yellow { fill: #FCD34D; }
    .blue { fill: #38BDF8; }
  </style>

  <!-- Ventana principal de Herdr -->
  <rect x="10" y="10" width="740" height="480" rx="12" fill="#0B0F17" stroke="url(#termBorder)" stroke-width="1.5" filter="url(#heroShadow)"/>

  <!-- Barra de título de la terminal -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 738 10 C 744.63 10 750 15.37 750 22 L 750 48 L 10 48 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="48" x2="750" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- Botones macOS de control de ventana -->
  <circle cx="32" cy="29" r="6" fill="#EF4444"/>
  <circle cx="52" cy="29" r="6" fill="#F59E0B"/>
  <circle cx="72" cy="29" r="6" fill="#10B981"/>

  <!-- Título central de la ventana -->
  <text x="380" y="33" text-anchor="middle" class="t-mono" font-size="12" font-weight="600" fill="#94A3B8">herdr — fluzo [bond team]</text>

  <!-- Badge de estado activo -->
  <rect x="618" y="21" width="118" height="18" rx="9" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
  <circle cx="628" cy="30" r="3.5" fill="#10E5C2"/>
  <text x="637" y="34" class="t-mono" font-size="10" font-weight="600" fill="#A7F3D0">2 AGENTES EN VIVO</text>

  <!-- ==================== SIDEBAR IZQUIERDA (Herdr Multiplexor) ==================== -->
  <rect x="10" y="48" width="180" height="442" fill="#090D15"/>
  <line x1="190" y1="48" x2="190" y2="490" stroke="#1E293B" stroke-width="1"/>

  <text x="24" y="74" class="t-mono dim" font-size="10" font-weight="700" letter-spacing="1">AGENTES ACTIVOS</text>

  <!-- Claude (Lead) -->
  <g transform="translate(20, 88)">
    <rect width="160" height="34" rx="6" fill="#131D2D" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="17" r="4" fill="#10E5C2"/>
    <text x="26" y="16" class="t-mono" font-size="11" font-weight="600" fill="#F1F5F9">claude</text>
    <text x="26" y="27" class="t-mono dim" font-size="9">lead (orquestador)</text>
    <text x="116" y="21" class="t-mono blue" font-size="9" font-weight="600">revisa</text>
  </g>

  <!-- pi-1 (Minion 1) -->
  <g transform="translate(20, 130)">
    <rect width="160" height="34" rx="6" fill="#0E1624"/>
    <circle cx="14" cy="17" r="4" fill="#06B6D4"/>
    <text x="26" y="16" class="t-mono" font-size="11" font-weight="500" fill="#E2E8F0">pi-auth</text>
    <text x="26" y="27" class="t-mono dim" font-size="9">worktree #1</text>
    <text x="104" y="21" class="t-mono green" font-size="9" font-weight="600">curra</text>
  </g>

  <!-- pi-2 (Minion 2) -->
  <g transform="translate(20, 172)">
    <rect width="160" height="34" rx="6" fill="#0E1624"/>
    <circle cx="14" cy="17" r="4" fill="#10B981"/>
    <text x="26" y="16" class="t-mono" font-size="11" font-weight="500" fill="#E2E8F0">pi-api</text>
    <text x="26" y="27" class="t-mono dim" font-size="9">worktree #2</text>
    <text x="114" y="21" class="t-mono green" font-size="9" font-weight="600">lista ✔</text>
  </g>

  <text x="24" y="235" class="t-mono dim" font-size="10" font-weight="700" letter-spacing="1">RAMAS GIT</text>
  <g transform="translate(24, 252)">
    <text x="0" y="0" class="t-mono" font-size="11" fill="#94A3B8">⎇ main</text>
    <text x="0" y="20" class="t-mono blue" font-size="11">⎇ feat/auth</text>
    <text x="0" y="40" class="t-mono green" font-size="11">⎇ feat/api (merged)</text>
  </g>

  <!-- ==================== PANE 1: ORQUESTADOR (Top Left) ==================== -->
  <rect x="190" y="48" width="280" height="230" fill="#0B0F17"/>
  <line x1="470" y1="48" x2="470" y2="278" stroke="#1E293B" stroke-width="1"/>
  <line x1="190" y1="278" x2="750" y2="278" stroke="#1E293B" stroke-width="1"/>

  <!-- Cabecera del pane -->
  <rect x="190" y="48" width="280" height="24" fill="#101726"/>
  <text x="204" y="64" class="t-mono" font-size="10" font-weight="600" fill="#94A3B8">panel 1: claude [lead]</text>

  <!-- Contenido Pane 1 -->
  <g transform="translate(204, 90)">
    <text x="0" y="0" class="t-mono cyan" font-size="11" font-weight="600">$ bond team --agents "claude,pi"</text>
    <text x="0" y="20" class="t-mono dim" font-size="11">Iniciando orquestación bond...</text>
    <text x="0" y="38" class="t-mono green" font-size="11">✔ Repartidas 2 tareas en worktrees</text>
    <text x="0" y="58" class="t-mono bright" font-size="11">[claude] Plan verificado:</text>
    <text x="12" y="76" class="t-mono norm" font-size="10">1. Token auth middleware</text>
    <text x="12" y="92" class="t-mono norm" font-size="10">2. Endpoint REST /v1/status</text>
    <text x="0" y="116" class="t-mono yellow" font-size="11">⚡ pi-auth: ejecutando tests...</text>
    <text x="0" y="136" class="t-mono bright" font-size="11">[claude] Supervisando integración</text>
    <text x="0" y="156" class="t-mono cyan" font-size="11">❯ _</text>
  </g>

  <!-- ==================== PANE 2: TABLA EN VIVO (Top Right) ==================== -->
  <rect x="470" y="48" width="280" height="230" fill="#0D121C"/>
  <rect x="470" y="48" width="280" height="24" fill="#131B2B"/>
  <text x="484" y="64" class="t-mono" font-size="10" font-weight="600" fill="#94A3B8">panel 2: bond status (live)</text>

  <g transform="translate(484, 90)">
    <text x="0" y="0" class="t-mono dim" font-size="10">┌─────────┬───────────┬────────────┐</text>
    <text x="0" y="16" class="t-mono dim" font-size="10">│ Agente  │ Rama      │ Estado     │</text>
    <text x="0" y="32" class="t-mono dim" font-size="10">├─────────┼───────────┼────────────┤</text>
    <text x="0" y="48" class="t-mono" font-size="10"><tspan class="norm">│ </tspan><tspan class="bright" font-weight="600">pi-auth </tspan><tspan class="norm">│ </tspan><tspan class="blue">feat/auth </tspan><tspan class="norm">│ </tspan><tspan class="yellow">trabajando </tspan><tspan class="norm">│</tspan></text>
    <text x="0" y="64" class="t-mono" font-size="10"><tspan class="norm">│ </tspan><tspan class="bright" font-weight="600">pi-api  </tspan><tspan class="norm">│ </tspan><tspan class="blue">feat/api  </tspan><tspan class="norm">│ </tspan><tspan class="green">lista ✔    </tspan><tspan class="norm">│</tspan></text>
    <text x="0" y="80" class="t-mono dim" font-size="10">└─────────┴───────────┴────────────┘</text>

    <!-- Barra de progreso visual -->
    <text x="0" y="112" class="t-mono norm" font-size="10">Progreso de fases:</text>
    <rect x="0" y="122" width="248" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="122" width="168" height="8" rx="4" fill="url(#termBorder)"/>
    <text x="0" y="148" class="t-mono green" font-size="10">✔ 1 merge completado en main</text>
    <text x="0" y="164" class="t-mono dim" font-size="10">Tiempo transcurrido: 1m 42s</text>
  </g>

  <!-- ==================== PANE 3: LOG STREAM (Bottom) ==================== -->
  <rect x="190" y="278" width="560" height="212" fill="#0A0E17"/>
  <rect x="190" y="278" width="560" height="24" fill="#0F1624"/>
  <text x="204" y="294" class="t-mono" font-size="10" font-weight="600" fill="#94A3B8">panel 3: minion logs · feat/auth (worktree #1)</text>

  <g transform="translate(204, 322)">
    <text x="0" y="0" class="t-mono" font-size="11"><tspan class="blue">[pi-auth]</tspan> <tspan class="bright">cargo test --package fluzo-auth</tspan></text>
    <text x="0" y="18" class="t-mono dim" font-size="11">   Compiling fluzo-auth v0.4.0 (/home/user/fluzo/worktrees/feat-auth)</text>
    <text x="0" y="36" class="t-mono green" font-size="11">   test tests::verify_bearer_token ... ok</text>
    <text x="0" y="54" class="t-mono green" font-size="11">   test tests::reject_expired_signature ... ok</text>
    <text x="0" y="72" class="t-mono dim" font-size="11">   test result: ok. 14 passed; 0 failed; 0 ignored; 0 measured</text>
    <text x="0" y="94" class="t-mono" font-size="11"><tspan class="cyan">[pi-auth]</tspan> <tspan class="green">✔ Cambios listos para revisión de Claude</tspan></text>
    <text x="0" y="114" class="t-mono yellow" font-size="11">git commit -m "feat(auth): add bearer verification"</text>
    <text x="0" y="134" class="t-mono dim" font-size="11">[13:42:09] Herdr: notificado lead claude</text>
  </g>
</svg>
