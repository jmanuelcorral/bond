# Compila bond en Linux, macOS y Windows y prueba el binario fuera del repo.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p .
      - run: bun test
      - run: bun scripts/build.mts --targets ${{ matrix.target }} --no-npm
      # Este repo usa bond: .agents/skills/ y demás deben seguir al catálogo (tras cambiarlo, bond
      # sync). Solo en Linux: en Windows sync copia en vez de enlazar.
      - name: La config de bond del repo está al día
        if: matrix.target == 'linux-x64'
        env:
          BOND_HOME: ${{ runner.temp }}/bond-home-sync
        run: dist/bond-linux-x64 sync --check
      - name: Prueba del binario fuera del repo
        env:
          BOND_HOME: ${{ runner.temp }}/bond-home
        run: |
          bin="$PWD/dist/bond-${{ matrix.target }}"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" init --list
          repo="${{ runner.temp }}/repo"
          mkdir -p "$repo" && cd "$repo" && git init -q
          "$bin" init --agents pi,claude,copilot,codex,opencode,crush,gemini
          "$bin" sync --check
          test -f .claude/skills/code-context/SKILL.md
          test -f .agents/skills/code-context/SKILL.md
          # Catálogo propio: create lo prepara y check lo da por bueno, igual que el de bond.
          cat="${{ runner.temp }}/catalogo"
          mkdir -p "$cat" && cd "$cat" && git init -q
          "$bin" catalog create --name equipo
          test -f mcps/README.md
          "$bin" catalog check
          "$bin" catalog check "$GITHUB_WORKSPACE/catalog"
      - name: Detecta un agente instalado (en Windows, por su extensión)
        env:
          BOND_HOME: ${{ runner.temp }}/bond-home
        run: |
          bin="$PWD/dist/bond-${{ matrix.target }}"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          fake="$PWD/.fake-agents" && mkdir -p "$fake"   # ruta POSIX también en Git Bash
          if [ "$RUNNER_OS" = Windows ]; then printf '@echo off\r\n' > "$fake/claude.cmd"
          else printf '#!/bin/sh\n' > "$fake/claude" && chmod +x "$fake/claude"; fi
          repo="${{ runner.temp }}/repo-detect"
          mkdir -p "$repo" && cd "$repo" && git init -q
          PATH="$fake:$PATH" "$bin" init --yes
          grep -q '"claude"' .bond/bond.toml
          test -f .mcp.json
      - name: Pasa a esta versión lo que usaba los ficheros de otra y borra los viejos
        if: runner.os != 'Windows'
        env:
          BOND_HOME: ${{ runner.temp }}/bond-home-refresh
          HOME: ${{ runner.temp }}/home-refresh
        run: |
          bin="$PWD/dist/bond-${{ matrix.target }}"
          old="$BOND_HOME/runtime/0.9.0"
          mkdir -p "$old/global/skills/bond-team" "$HOME/.agents/skills"
          ln -s "$old/global/skills/bond-team" "$HOME/.agents/skills/bond-team"
          ln -s "$old" "$BOND_HOME/pi"
          "$bin" init --list > /dev/null
          v="$("$bin" --version)"
          [ "$(readlink "$BOND_HOME/pi")" = "$BOND_HOME/runtime/$v" ]
          [ "$(readlink "$HOME/.agents/skills/bond-team")" = "$BOND_HOME/runtime/$v/global/skills/bond-team" ]
          [ ! -e "$old" ]
