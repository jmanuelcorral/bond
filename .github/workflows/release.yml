# Al subir un tag vX.Y.Z: compila bond para todas las plataformas, genera SHA256SUMS y crea la
# release de GitHub con las notas de esa versión del CHANGELOG. Los instaladores (install.sh,
# install.ps1) y la fórmula de Homebrew descargan de aquí. Además deja en npm el mismo .tgz que
# se adjunta a la release mediante STAGED PUBLISHING (npm stage publish, sin 2FA): con el secret
# NPM_TOKEN si está definido y, si no, por OIDC (trusted publishing). Un mantenedor aprueba
# después el staged package con 2FA ('npm stage approve <stage-id>' o la pestaña Staged
# Packages de npmjs.com); hasta entonces la versión no queda pública.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Se cuña el OIDC token de GitHub: de aqui salen el trusted publishing de npm y las
  # attestations de --provenance (tambien con stage publish). Sin esto, ni lo uno ni lo otro.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # El staged publishing de npm exige npm CLI >= 11.15.0 y Node >= 22.14.0. ubuntu-latest
      # trae npm 10.9.9: sin este paso 'npm stage' no existiria. El paso siguiente lo comprueba.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm >= 11.15.0 (staged publishing)
        run: |
          v="$(npm --version)"
          echo "npm $v"
          [ "$(printf '%s\n' 11.15.0 "$v" | sort -V | head -1)" = "11.15.0" ] \
            || { echo "npm staged publishing requiere npm >= 11.15.0 y hay $v"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Versión del tag = versión de package.json
        run: |
          v="$(jq -r .version package.json)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "el tag $GITHUB_REF_NAME no coincide con package.json ($v)"; exit 1; }
      - run: bun scripts/build.mts
      - name: Prueba del binario
        env:
          BOND_HOME: ${{ runner.temp }}/bond-home
        run: |
          dist/bond-linux-x64 --version
          repo="${{ runner.temp }}/repo" && mkdir -p "$repo" && cd "$repo" && git init -q
          "$GITHUB_WORKSPACE/dist/bond-linux-x64" init --agents pi,claude
          "$GITHUB_WORKSPACE/dist/bond-linux-x64" sync --check
      - name: Paquete de npm y sumas
        run: |
          (cd dist/npm && npm pack --silent && mv ./*.tgz ../)
          cd dist && sha256sum bond-* *.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Notas de la versión
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n## Instalar\n\n```sh\ncurl -fsSL https://raw.githubusercontent.com/jmanuelcorral/bond/main/install.sh | sh\n```\n\nWindows: `irm https://raw.githubusercontent.com/jmanuelcorral/bond/main/install.ps1 | iex`\n' >> notes.md
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotente (#83): si la release ya existe (rerun tras un fallo aguas abajo, p.ej.
        # el publish de npm), se edita y se sobrescriben los assets con --clobber en vez de
        # fallar. Asi un reintento no se lleva por delante lo que viene detras ni obliga a
        # borrar la release y su tag para poder reintentar.
        run: |
          assets=(dist/bond-* dist/*.tgz dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "bond $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "bond $GITHUB_REF_NAME" --notes-file notes.md "${assets[@]}"
          fi
      # npm: staged publishing (https://docs.npmjs.com/staged-publishing/). Se deja en el
      # staging el MISMO .tgz que se adjunta a la release, no un pack nuevo: 'npm stage publish'
      # no requiere 2FA y funciona con cualquier tipo de token; un mantenedor aprueba despues
      # con 2FA ('npm stage approve <stage-id>' o la pestana Staged Packages de npmjs.com) y es
      # entonces cuando la version queda publica. Autentificacion en dos rutas: si el secret
      # NPM_TOKEN esta definido, se escribe en ~/.npmrc (ya no hace falta bypass de 2FA); si no,
      # no se escribe ningun token y npm autentifica por OIDC: el trusted publisher de npmjs
      # (repo jmanuelcorral/bond, workflow release.yml) debe tener permiso para 'npm stage
      # publish'. El token llega por variable de entorno y solo se redirige al .npmrc: nunca se
      # imprime. Con --loglevel verbose el log muestra la ruta de autentificacion usada.
      # El stage-id se extrae de la salida del propio stage publish ('+ nombre@version (staged
      # with id <uuid>)'): los tokens OIDC de corta vida no pueden ejecutar subcomandos 'npm
      # stage' como 'npm stage list', asi que la salida es la unica via valida en las dos rutas.
      - name: Dejar el paquete en el staging de npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # Registry explicito: una config de scope rara (p.ej. el scope apuntando a
          # npm.pkg.github.com) no debe desviar la publicacion.
          printf '@jmanuelcorral:registry=https://registry.npmjs.org/\n' > "$HOME/.npmrc"
          if [ -n "$NPM_TOKEN" ]; then
            echo "autenticacion npm: NPM_TOKEN (stage publish no pide 2FA ni bypass)"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          else
            echo "autenticacion npm: OIDC trusted publishing (sin token)"
          fi
          cd "$GITHUB_WORKSPACE/dist"
          tgz="$(ls ./*.tgz)"
          [ -f "$tgz" ] || { echo "esperaba un unico .tgz en dist/"; exit 1; }
          grep -F " $(basename "$tgz")" SHA256SUMS | sha256sum -c -
          name="$(jq -r .name npm/package.json)"
          version="$(jq -r .version ../package.json)"
          npm stage publish "$tgz" --access public --provenance --loglevel verbose 2>&1 \
            | tee /tmp/stage-publish.log
          stage_id="$(sed -n 's/.*staged with id \([0-9a-fA-F-]\{36\}\).*/\1/p' /tmp/stage-publish.log | tail -1)"
          # Instrucciones de aprobacion en el resumen del job: el staged package no es publico
          # hasta que un mantenedor lo aprueba con 2FA.
          {
            echo "## Staging de npm: \`$name@$version\`"
            echo ""
            if [ -n "$stage_id" ]; then
              echo "Stage-id: \`$stage_id\`"
              echo ""
              echo "Para publicarlo, un mantenedor debe aprobarlo con 2FA:"
              echo ""
              echo '```sh'
              echo "npm stage approve $stage_id"
              echo '```'
              echo ""
            else
              echo "No se pudo extraer el stage-id de la salida; localizalo con '\`npm stage list $name\`' o en npmjs.com."
              echo ""
            fi
            echo "Alternativa sin CLI: en npmjs.com, pestana **Staged Packages** (tu cuenta) > Approve. Revisa el shasum antes de aprobar."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$stage_id" ]; then
            echo "staged con stage-id $stage_id; pendiente de aprobacion con 2FA por un mantenedor"
          else
            echo "staged; sin stage-id en la salida: buscalo con 'npm stage list $name' o en la pestana Staged Packages de npmjs.com"
          fi
