# Al subir un tag vX.Y.Z: compila bond para todas las plataformas, genera SHA256SUMS y crea la
# release de GitHub con las notas de esa versión del CHANGELOG. Los instaladores (install.sh,
# install.ps1) y la fórmula de Homebrew descargan de aquí. Además publica en npm el mismo .tgz
# que se adjunta a la release, autenticando por OIDC (trusted publishing); el secret NPM_TOKEN
# se mantiene como red de seguridad.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Se cuña el OIDC token de GitHub: de aqui salen el trusted publishing de npm y las
  # attestations de --provenance. Sin esto, ni lo uno ni lo otro.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Trusted publishing exige npm >= 11.5.1 y Node >= 22.14.0. ubuntu-latest trae
      # npm 10.9.9, que no habla OIDC: sin este paso el publish se haria con token y la
      # configuracion de trusted publisher de npm no llegaria a validarse nunca.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Versión del tag = versión de package.json
        run: |
          v="$(jq -r .version package.json)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "el tag $GITHUB_REF_NAME no coincide con package.json ($v)"; exit 1; }
      - run: bun scripts/build.mts
      - name: Prueba del binario
        env:
          BOND_HOME: ${{ runner.temp }}/bond-home
        run: |
          dist/bond-linux-x64 --version
          repo="${{ runner.temp }}/repo" && mkdir -p "$repo" && cd "$repo" && git init -q
          "$GITHUB_WORKSPACE/dist/bond-linux-x64" init --agents pi,claude
          "$GITHUB_WORKSPACE/dist/bond-linux-x64" sync --check
      - name: Paquete de npm y sumas
        run: |
          (cd dist/npm && npm pack --silent && mv ./*.tgz ../)
          cd dist && sha256sum bond-* *.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Notas de la versión
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n## Instalar\n\n```sh\ncurl -fsSL https://raw.githubusercontent.com/jmanuelcorral/bond/main/install.sh | sh\n```\n\nWindows: `irm https://raw.githubusercontent.com/jmanuelcorral/bond/main/install.ps1 | iex`\n' >> notes.md
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotente (#83): si la release ya existe (rerun tras un fallo aguas abajo, p.ej.
        # el publish de npm), se edita y se sobrescriben los assets con --clobber en vez de
        # fallar. Asi un reintento no se lleva por delante lo que viene detras ni obliga a
        # borrar la release y su tag para poder reintentar.
        run: |
          assets=(dist/bond-* dist/*.tgz dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "bond $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "bond $GITHUB_REF_NAME" --notes-file notes.md "${assets[@]}"
          fi
      # npm: se publica el MISMO .tgz que se adjunta a la release, no un pack nuevo.
      # La autentificacion va por OIDC (trusted publishing): npm detecta el entorno GitHub
      # Actions y usa el OIDC token antes de mirar tokens tradicionales. El NPM_TOKEN se
      # mantiene como red de seguridad, no como lo que autoriza el publish.
      - name: ¿Hay NPM_TOKEN?
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo enabled=true >> "$GITHUB_OUTPUT"
          else
            echo enabled=false >> "$GITHUB_OUTPUT"
            echo "Sin el secret NPM_TOKEN: no se publica @jmanuelcorral/bond en npm. La release queda creada igual; añade el secret en Settings -> Secrets and variables -> Actions para publicar." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar en npm
        if: steps.npm.outputs.enabled == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Registry explicito: una config de scope rara (p.ej. el scope apuntando a
          # npm.pkg.github.com) no debe desviar la publicacion.
          printf '@jmanuelcorral:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          cd "$GITHUB_WORKSPACE/dist"
          tgz="$(ls ./*.tgz)"
          [ -f "$tgz" ] || { echo "esperaba un unico .tgz en dist/"; exit 1; }
          grep -F " $(basename "$tgz")" SHA256SUMS | sha256sum -c -
          npm publish "$tgz" --access public --provenance
          name="$(jq -r .name npm/package.json)"
          npm view "$name@$(jq -r .version ../package.json)" version \
            || echo "::warning::npm todavia no responde por $name; revisa https://www.npmjs.com/package/$name"
