# Catálogo de bond: lo que enseña `bond init` de cada skill (summary, en inglés) y si sale
# marcada por defecto (default = false: aparece en la lista, pero hay que marcarla).

[skills.code-context]
summary = "Gather just enough repo and library context before editing"

[skills.git-conventional-commit]
summary = "Create one reviewed, scoped Conventional Commit"

[skills.plan-create]
summary = "Plan a task as verifiable phases in docs/plans"

[skills.plan-execute]
summary = "Implement one approved plan phase, with evidence"

[skills.issue-refine-github]
summary = "Refine a GitHub issue before work: keep, expand or split it"
default = false

[skills.delivery-review-github]
summary = "Review a phase, then push and open its PR; after merge, pick what's next"
default = false

[skills.convention-document]
summary = "Turn a confirmed team agreement into a documented convention"
default = false

[skills.release-prepare-github]
summary = "Write the changelog, prepare a version and publish an approved release"
default = false

[skills.plan-team]
summary = "Run a plan's independent phases in parallel, one bond team branch each"
default = false
